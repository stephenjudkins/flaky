[workspace]
members = ["host", "guest-init", "vm-controller-rpc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alioth = "0.12"
anyhow = "1"
arcbox-ext4 = "0.1"
backhand = "0.25"
bytes = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
erofs-builder = "0.1"
flate2 = "1"
futures = "0.3"
libc = "0.2"
log = "0.4"
mio = "1.2.2"
nix = { version = "0.31", features = ["fs", "mount", "reboot"] }
oci-spec = "0.10"
pid1 = "0.1"
postcard = { version = "1", default-features = false, features = ["use-std", "alloc"] }
serde = "1"
serde_json = "1"
tar = "0.4"
tarpc = { version = "0.36", features = ["serde-transport"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "net", "time"] }
tokio-serde = { version = "0.9", default-features = false }
tokio-vsock = "0.7"
vm-controller-rpc = { path = "vm-controller-rpc" }
zstd = "0.13"
